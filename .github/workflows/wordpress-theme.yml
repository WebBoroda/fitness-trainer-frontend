name: WordPress Theme CI

on:
  push:
    branches:
      - feature/dynamic-wordpress-theme
  pull_request:
    paths:
      - 'wordpress-theme/**'
      - '.github/workflows/wordpress-theme.yml'

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          tools: none
      - name: Validate PHP syntax
        run: |
          find wordpress-theme/yuliia-fitness -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: |
          node --check wordpress-theme/yuliia-fitness/assets/js/site.js
          node --check wordpress-theme/yuliia-fitness/assets/js/editor.js
      - name: Validate theme JSON and media structure
        run: python3 wordpress-theme/yuliia-fitness/tests/check_assets.py
      - name: Package installable WordPress theme
        run: |
          (cd wordpress-theme && zip -q -r "$GITHUB_WORKSPACE/yuliia-fitness.zip" yuliia-fitness)
      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yuliia-fitness-wordpress-theme
          path: yuliia-fitness.zip
          retention-days: 14
      - name: Editor and visual QA note
        run: echo 'Gutenberg visual editor and pixel-perfect review require manual staging QA.'

  wordpress-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring, gd, zip
          tools: none
      - name: Download WordPress and WordPress CLI
        run: |
          curl -fsSL https://wordpress.org/latest.tar.gz | tar -xz -C "$RUNNER_TEMP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          cp -R wordpress-theme/yuliia-fitness "$RUNNER_TEMP/wordpress/wp-content/themes/yuliia-fitness"
      - name: Install and activate dynamic theme
        run: |
          WP="php $RUNNER_TEMP/wp-cli.phar --path=$RUNNER_TEMP/wordpress"
          $WP config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          $WP core install --url=http://127.0.0.1:8765 --title=Yuliia-CI --admin_user=ciadmin --admin_password=temporary-ci-password --admin_email=ci@example.com --skip-email
          $WP theme activate yuliia-fitness
          $WP option update home http://127.0.0.1:8765
          $WP option update siteurl http://127.0.0.1:8765
          $WP option get page_on_front
          $WP option get siteurl
          $WP eval 'echo get_theme_file_uri("/assets/images/hero-trainer.webp") . "\\n";'
      - name: Verify Gutenberg persistence and PHP rendering
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" --path="$RUNNER_TEMP/wordpress" eval-file "$RUNNER_TEMP/wordpress/wp-content/themes/yuliia-fitness/tests/runtime.php"
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python3 -m playwright install --with-deps chromium
          fi
      - name: Smoke-test rendered homepage over HTTP
        run: |
          php -S 127.0.0.1:8765 -t "$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/yf-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 3
          curl --retry 3 --retry-delay 1 -fsS http://127.0.0.1:8765/ -o "$RUNNER_TEMP/yf-home.html"
          grep -q 'ТЕСТ РЕДАГУВАННЯ' "$RUNNER_TEMP/yf-home.html"
          grep -q 'id="contact"' "$RUNNER_TEMP/yf-home.html"
          grep -q 'assets/js/site.js' "$RUNNER_TEMP/yf-home.html"
          python3 wordpress-theme/yuliia-fitness/tests/browser_smoke.py
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-responsive-smoke
          path: wordpress-theme/yuliia-fitness/tests/_screenshots/
          if-no-files-found: ignore
          retention-days: 7
