name: Frontend QA and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'Using runner-provided Google Chrome'
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Build SEO pages and validate central settings
        run: python tests/site_config_smoke.py
      - name: Verify Premium Motion, parallax and reduced-motion fallback
        run: python tests/premium_motion_smoke.py
      - name: Verify bilingual device detection, persistence, contact footer and CTA geometry
        run: python tests/bilingual_system_smoke.py
      - name: Verify accessibility basics, focus, interactions and text contrast
        run: python tests/accessibility_smoke.py
      - name: Verify reference geometry and responsive interactions
        run: python tests/smoke.py
      - name: Verify full-page frontend interactions
        run: python tests/experience_smoke.py
      - name: Verify light-theme surfaces and dark-theme isolation
        run: python tests/light_theme_smoke.py
      - name: Check third-screen card photos and alignment
        run: python tests/formats_cards_smoke.py
      - name: Enforce visual-layout gate before deployment
        run: python tests/hero_visual_audit.py
      - name: Store editable source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-source
          path: |
            index.html
            README.md
            assets/
            tools/
            tests/
            .github/workflows/
          retention-days: 14
      - name: Store test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: tests/_screenshots/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build configured static website
        run: python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
